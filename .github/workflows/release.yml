name: Release

on:
  workflow_call:
    inputs:
      version:
        description: SemVer without leading v
        required: true
        type: string
      tag:
        description: Release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      commit:
        description: Full commit SHA targeted by the tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without leading v
        required: true
        default: 0.0.0-dry-run
        type: string
      tag:
        description: Existing release tag to rebuild or publish; leave empty for a dry run
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  STATICCHECK_VERSION: v0.8.1
  GOVULNCHECK_VERSION: v1.8.0
  SYFT_VERSION: v1.43.0
  MQTT_TEST_BROKER: tcp://127.0.0.1:1883

jobs:
  build:
    name: Verify and build release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Check out release commit and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || inputs.commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up release Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Validate source and select version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go$(cat .go-version)"

          if [[ "$GITHUB_EVENT_NAME" == workflow_call ]]; then
            test -n "$REQUESTED_VERSION"
            test -n "$REQUESTED_TAG"
            test -n "$REQUESTED_COMMIT"
            version=$REQUESTED_VERSION
            tag=$REQUESTED_TAG
            commit=$REQUESTED_COMMIT
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=${GITHUB_REF_NAME#v}
            tag=$GITHUB_REF_NAME
            commit=$GITHUB_SHA
          elif [[ -n "$REQUESTED_TAG" ]]; then
            version=$REQUESTED_VERSION
            tag=$REQUESTED_TAG
            commit=$(git rev-list -n1 "$tag")
          else
            version=$REQUESTED_VERSION
            tag=
            commit=$GITHUB_SHA
          fi

          ./scripts/validate-version.sh "$version"
          if [[ -n "$tag" ]]; then
            test "$tag" = "v$version"
            test "$(git rev-list -n1 "$tag")" = "$commit"
            git rev-parse --verify origin/main
            git merge-base --is-ancestor "$commit" origin/main
          fi

          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >>"$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$commit" >>"$GITHUB_OUTPUT"

      - name: Start pinned Mosquitto
        run: |
          docker run --detach --rm --name mqtt-raspberry-controller-release-test \
            --publish 127.0.0.1:1883:1883 \
            --volume "$GITHUB_WORKSPACE/packaging/mosquitto/test.conf:/mosquitto/config/mosquitto.conf:ro" \
            eclipse-mosquitto:2.0.20@sha256:21421af7b32bf9ce508e9090c8eb13bb81f410ca778dc205506180a6f862d0eb
          timeout 30 bash -c 'until (echo > /dev/tcp/127.0.0.1/1883) 2>/dev/null; do sleep 0.25; done'

      - name: Run release quality gates
        run: |
          make fmt-check tidy-check vet test packaging-check
          go test -race ./...
          go install honnef.co/go/tools/cmd/staticcheck@"$STATICCHECK_VERSION"
          staticcheck ./...
          go install golang.org/x/vuln/cmd/govulncheck@"$GOVULNCHECK_VERSION"
          govulncheck ./...

      - name: Download pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      - name: Build and verify release assets
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          VERSION: ${{ steps.version.outputs.version }}
          QUALITY_GATES_STATUS: PASS (fmt, tidy, vet, ordinary tests, staticcheck, govulncheck, packaging)
          BROKER_TEST_STATUS: PASS (broker-backed race suite)
          RELEASE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./scripts/build-release.sh "$VERSION"
          ./scripts/verify-release.sh "$VERSION"

      - name: Attest public release artifacts
        if: github.event.repository.visibility == 'public' && steps.version.outputs.tag != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload dry-run/release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mqtt-raspberry-controller-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Show broker logs
        if: failure()
        run: docker logs mqtt-raspberry-controller-release-test

      - name: Stop broker
        if: always()
        run: docker stop mqtt-raspberry-controller-release-test || true

  publish:
    name: Publish verified GitHub Release
    if: needs.build.outputs.tag != ''
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mqtt-raspberry-controller-${{ needs.build.outputs.version }}
          path: dist

      - name: Attach assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          remote_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          test "$remote_commit" = "$EXPECTED_COMMIT"

          semver_without_build=${RELEASE_VERSION%%+*}
          expected_prerelease=false
          if [[ "$semver_without_build" == *-* ]]; then
            expected_prerelease=true
          fi

          if release_info=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease 2>/dev/null); then
            is_draft=$(jq -r .isDraft <<<"$release_info")
            is_prerelease=$(jq -r .isPrerelease <<<"$release_info")
            if [[ "$is_draft" == true ]]; then
              gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --prerelease="$expected_prerelease" \
                --draft=false
            else
              test "$is_prerelease" = "$expected_prerelease"
              remote_dir=$(mktemp -d)
              trap 'rm -rf "$remote_dir"' EXIT
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$remote_dir"
              (
                cd "$remote_dir"
                sha256sum --check SHA256SUMS
              )
              cmp -s "$remote_dir/SHA256SUMS" dist/SHA256SUMS || {
                printf '%s\n' 'published release assets differ; publish a new patch release instead of replacing them' >&2
                exit 1
              }
              remote_assets=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
              local_assets=$(printf '%s\n' dist/* | sed 's#^dist/##' | sort)
              test "$remote_assets" = "$local_assets" || {
                printf '%s\n' 'published release asset names differ; refusing to mutate the release' >&2
                exit 1
              }
              printf 'published release %s already contains the verified assets; no changes made\n' "$RELEASE_TAG"
            fi
          else
            prerelease=()
            if [[ "$expected_prerelease" == true ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG" \
              "${prerelease[@]}"
          fi

          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
