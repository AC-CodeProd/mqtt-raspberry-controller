[Service]
# Install this as mqtt-raspberry-controller.service.d/mtls.conf after replacing the
# source paths with root-owned certificate material.
LoadCredential=mqtt-ca:/etc/mqtt-raspberry-controller/ca.pem
LoadCredential=mqtt-client-cert:/etc/mqtt-raspberry-controller/client.pem
LoadCredential=mqtt-client-key:/etc/mqtt-raspberry-controller/client.key
Environment=MQTT_CA_FILE=%d/mqtt-ca
Environment=MQTT_CLIENT_CERT_FILE=%d/mqtt-client-cert
Environment=MQTT_CLIENT_KEY_FILE=%d/mqtt-client-key
